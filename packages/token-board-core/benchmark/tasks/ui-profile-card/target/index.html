<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
body{background:#0f172a;display:flex;align-items:center;justify-content:center;min-height:600px}
.card{width:360px;background:#fff;border-radius:16px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.row{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a855f7)}
.name{font-size:16px;font-weight:700;color:#0f172a}
.handle{font-size:13px;color:#64748b}
.bio{margin-top:16px;font-size:14px;line-height:1.5;color:#334155}
.stats{display:flex;gap:24px;margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0}
.stat .n{font-size:18px;font-weight:700;color:#0f172a}
.stat .l{font-size:12px;color:#94a3b8}
.btn{margin-top:20px;width:100%;padding:10px;border:0;border-radius:10px;background:#6366f1;color:#fff;font-weight:600;font-size:14px}
</style></head><body>
<div class="card">
  <div class="row"><div class="avatar"></div><div><div class="name">Ada Lovelace</div><div class="handle">@ada</div></div></div>
  <p class="bio">First programmer. Working on analytical engines and poetical science.</p>
  <div class="stats"><div class="stat"><div class="n">1.2k</div><div class="l">Following</div></div><div class="stat"><div class="n">8.4k</div><div class="l">Followers</div></div></div>
  <button class="btn">Follow</button>
</div></body></html>
