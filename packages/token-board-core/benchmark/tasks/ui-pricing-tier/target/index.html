<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
body{background:#f1f5f9;display:flex;align-items:center;justify-content:center;min-height:600px}
.card{position:relative;width:340px;background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:32px;box-shadow:0 20px 50px rgba(99,102,241,.15)}
.badge{position:absolute;top:20px;right:20px;background:#eef2ff;color:#6366f1;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.plan{font-size:14px;font-weight:700;color:#6366f1;text-transform:uppercase;letter-spacing:1px}
.price{margin-top:12px;display:flex;align-items:baseline;gap:4px}
.amount{font-size:48px;font-weight:800;color:#0f172a;line-height:1}
.period{font-size:15px;font-weight:500;color:#94a3b8}
.tagline{margin-top:10px;font-size:14px;line-height:1.5;color:#64748b}
.divider{height:1px;background:#e2e8f0;margin:24px 0}
.feature{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:14px;color:#334155}
.feature:last-child{margin-bottom:0}
.check{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:#dcfce7;color:#16a34a;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.cta{margin-top:28px;width:100%;padding:13px;border:0;border-radius:12px;background:#6366f1;color:#fff;font-size:15px;font-weight:700}
</style></head><body>
<div class="card">
  <span class="badge">Most popular</span>
  <div class="plan">Pro</div>
  <div class="price"><span class="amount">$24</span><span class="period">/month</span></div>
  <p class="tagline">Everything you need to scale your team and ship faster.</p>
  <div class="divider"></div>
  <div class="feature"><span class="check">&#10003;</span>Unlimited projects</div>
  <div class="feature"><span class="check">&#10003;</span>Up to 20 team members</div>
  <div class="feature"><span class="check">&#10003;</span>Advanced analytics</div>
  <div class="feature"><span class="check">&#10003;</span>Priority support</div>
  <div class="feature"><span class="check">&#10003;</span>Custom integrations</div>
  <button class="cta">Get started</button>
</div></body></html>
