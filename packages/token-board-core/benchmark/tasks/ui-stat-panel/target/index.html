<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
body{background:#0f172a;display:flex;align-items:center;justify-content:center;min-height:600px}
.panel{width:640px;background:#fff;border-radius:16px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.head{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid #e2e8f0}
.title{font-size:18px;font-weight:700;color:#0f172a}
.pill{font-size:12px;font-weight:600;color:#475569;background:#f1f5f9;border-radius:999px;padding:4px 12px}
.cards{display:flex;gap:16px;margin-top:20px}
.card{flex:1;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:16px}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#94a3b8}
.num{margin-top:8px;font-size:28px;font-weight:700;color:#0f172a}
.delta{margin-top:6px;font-size:13px;font-weight:600}
.up{color:#16a34a}
.down{color:#dc2626}
</style></head><body>
<div class="panel">
  <div class="head"><div class="title">Performance Overview</div><div class="pill">Last 7 days</div></div>
  <div class="cards">
    <div class="card"><div class="label">Revenue</div><div class="num">$48.2k</div><div class="delta up">&#9650; +12.4%</div></div>
    <div class="card"><div class="label">Active Users</div><div class="num">9,318</div><div class="delta down">&#9660; -3.1%</div></div>
    <div class="card"><div class="label">Conversion</div><div class="num">4.7%</div><div class="delta up">&#9650; +0.8%</div></div>
  </div>
</div></body></html>
