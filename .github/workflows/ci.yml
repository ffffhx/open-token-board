name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: token_board_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d token_board_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TOKEN_BOARD_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/token_board_test
      TOKEN_BOARD_REQUIRE_POSTGRES_TESTS: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:api

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm test

      - name: Build site and agent package
        run: pnpm build
        env:
          PAGES_BASE_PATH: /open-token-board
          NEXT_PUBLIC_TOKEN_BOARD_API_URL: https://124-221-36-36.anyip.dev:8443/token-board

      - name: Build Docker image
        if: runner.os == 'Linux'
        run: docker build -f deploy/token-board/Dockerfile .

  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Run API regression tests
        run: pnpm test:api

      - name: Run E2E smoke tests
        run: pnpm test:e2e
