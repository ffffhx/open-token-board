name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm test

      - name: Build site and agent package
        run: pnpm build
        env:
          PAGES_BASE_PATH: /open-token-board
          NEXT_PUBLIC_TOKEN_BOARD_API_URL: https://124-221-36-36.anyip.dev/token-board

      - name: Build Docker image
        run: docker build -f deploy/token-board/Dockerfile .
